version: '3.8'

services:
  # Next.js Fullstack Web App
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algohabit_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://algouser:algopass123@db:5432/algohabit?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=algohabit_super_secret_key_change_me_in_prod
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: algohabit_db
    restart: always
    environment:
      POSTGRES_USER: algouser
      POSTGRES_PASSWORD: algopass123
      POSTGRES_DB: algohabit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algouser -d algohabit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
